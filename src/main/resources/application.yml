spring:
  application:
    name: springbootplay

  datasource:
    url: jdbc:mysql://localhost:3306/players
    username: appuser
    password: mypassword

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: player,players
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,metrics,caches
  endpoint:
    health:
      show-details: always