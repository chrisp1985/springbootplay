spring:
  application:
    name: springbootplay

  datasource:
    url: jdbc:mysql://localhost:3306/players
    username: appuser
    password: mypassword

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,flyway
  endpoint:
    health:
      show-details: always