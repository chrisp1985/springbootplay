spring:
  application:
    name: springbootplay

  datasource:
    url: jdbc:mysql://localhost:3306/players
    username: appuser
    password: mypassword

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-opus-5

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,caches